- name: Provision sandbox layer
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    sandbox_gateway_host: "{{ gondolin_sandbox_host | default('127.0.0.1') }}"
    sandbox_gateway_port: "{{ gondolin_sandbox_port | default(38070) }}"
    gondolin_repo: "{{ gondolin_repo_url | default('https://github.com/earendil-works/gondolin.git') }}"
  roles:
    - sandbox
