---
- name: Normalize requested sandbox state
  ansible.builtin.set_fact:
    open_creel_sandbox_state: "{{ sandbox_state | default('present') | trim | lower }}"

- name: Validate requested sandbox state
  ansible.builtin.assert:
    that:
      - open_creel_sandbox_state in ["present", "absent"]
    fail_msg: "sandbox_state must be one of: present, absent"

- name: Provision sandbox layer
  when: open_creel_sandbox_state == "present"
  block:
    - name: Ensure sandbox host prerequisites are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - qemu-system-x86
        state: present

    - name: Ensure Gondolin spool directories exist on host
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/open-creel/data/spool
        - /var/lib/open-creel/data/spool/gondolin
        - /var/lib/open-creel/data/spool/gondolin/openclaw
        - /var/lib/open-creel/data/spool/gondolin/ebpf

    - name: Ensure vendor directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir | dirname }}/vendor"
        state: directory
        mode: "0755"
      become: false

    - name: Clone or update Gondolin source
      ansible.builtin.git:
        repo: "{{ gondolin_repo }}"
        dest: "{{ playbook_dir | dirname }}/vendor/gondolin"
        update: true
        force: true
      become: false

    - name: Install Gondolin host npm dependencies
      ansible.builtin.command: npm install
      args:
        chdir: "{{ playbook_dir | dirname }}/vendor/gondolin/host"
      become: false

    - name: Build Gondolin host CLI
      ansible.builtin.command: npm run build
      args:
        chdir: "{{ playbook_dir | dirname }}/vendor/gondolin/host"
      become: false

    - name: Install Gondolin sandbox lifecycle service
      ansible.builtin.copy:
        dest: /etc/systemd/system/open-creel-gondolin-sandbox.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=open-creel Gondolin sandbox lifecycle
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory={{ playbook_dir | dirname }}/vendor/gondolin/host
          ExecStart=node {{ playbook_dir | dirname }}/vendor/gondolin/host/dist/bin/gondolin.js bash --ssh --ssh-user root --ssh-listen 127.0.0.1 --ssh-port {{ gondolin_ssh_port | default(3222) | int }} --mount-hostfs /var/lib/open-creel/data/spool/gondolin:/spool --mount-hostfs {{ playbook_dir | dirname }}:/workspace -- /bin/sh -lc 'set -euo pipefail; exec tail -f /dev/null'
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      register: gondolin_sandbox_unit_write

    - name: Reload systemd for sandbox service
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart Gondolin sandbox service
      ansible.builtin.systemd:
        name: open-creel-gondolin-sandbox.service
        enabled: true
        state: restarted

    - name: Verify Gondolin sandbox service is active
      ansible.builtin.command: systemctl is-active open-creel-gondolin-sandbox.service
      register: gondolin_sandbox_service_active
      retries: 12
      delay: 5
      until: gondolin_sandbox_service_active.stdout == "active"
      changed_when: false

    - name: Read Gondolin sandbox service invocation id
      ansible.builtin.command: systemctl show -p InvocationID --value open-creel-gondolin-sandbox.service
      register: gondolin_sandbox_invocation_id
      changed_when: false
      failed_when: gondolin_sandbox_invocation_id.stdout | trim == ""

    - name: Read Gondolin SSH access command from sandbox service logs
      ansible.builtin.command:
        argv:
          - journalctl
          - "_SYSTEMD_INVOCATION_ID={{ gondolin_sandbox_invocation_id.stdout | trim }}"
          - -n
          - "200"
          - --no-pager
          - -o
          - cat
      register: gondolin_sandbox_logs
      retries: 30
      delay: 2
      until: "'SSH enabled: ssh ' in gondolin_sandbox_logs.stdout"
      changed_when: false

    - name: Extract Gondolin SSH command from service logs
      ansible.builtin.set_fact:
        gondolin_ssh_command: >-
          {{
            gondolin_sandbox_logs.stdout_lines
            | select('search', '^SSH enabled: ssh ')
            | list
            | last
            | regex_replace('^SSH enabled: ', '')
          }}

    - name: Extract Gondolin SSH identity path and user from SSH command
      ansible.builtin.set_fact:
        gondolin_ssh_identity_path: "{{ gondolin_ssh_command.split(' ')[4] }}"
        gondolin_ssh_user: "{{ gondolin_ssh_command.split(' ') | last | split('@') | first }}"

    - name: Copy Gondolin SSH identity for Ansible guest access
      ansible.builtin.copy:
        src: "{{ gondolin_ssh_identity_path }}"
        dest: "{{ playbook_dir }}/gondolin_ssh_key"
        remote_src: true
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'USER') }}"
        mode: "0600"

    - name: Write Gondolin Ansible inventory for guest SSH provisioning
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/gondolin_inventory"
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'USER') }}"
        mode: "0644"
        content: |
          [gondolin]
          gondolin ansible_host=127.0.0.1 ansible_port={{ gondolin_ssh_port | default(3222) | int }} ansible_user={{ gondolin_ssh_user }} ansible_ssh_private_key_file={{ playbook_dir }}/gondolin_ssh_key ansible_ssh_common_args='-o ForwardAgent=no -o ClearAllForwardings=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

- name: Remove sandbox layer
  when: open_creel_sandbox_state == "absent"
  block:
    - name: Stop and disable Gondolin sandbox service
      ansible.builtin.systemd:
        name: open-creel-gondolin-sandbox.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove Gondolin sandbox lifecycle service unit
      ansible.builtin.file:
        path: /etc/systemd/system/open-creel-gondolin-sandbox.service
        state: absent

    - name: Reload systemd after sandbox unit removal
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Remove generated Gondolin guest access artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ playbook_dir }}/gondolin_inventory"
        - "{{ playbook_dir }}/gondolin_ssh_key"

    - name: Remove Gondolin root session registry state
      ansible.builtin.file:
        path: /root/.cache/gondolin/sessions
        state: absent

    - name: Find transient Gondolin VM artifacts under /tmp
      ansible.builtin.find:
        paths: /tmp
        patterns:
          - gondolin-disk-*.qcow2
          - gondolin-virtio-*.sock
          - gondolin-virtio-fs-*.sock
          - gondolin-virtio-ssh-*.sock
          - gondolin-virtio-ingress-*.sock
          - gondolin-net-*.sock
        file_type: any
      register: gondolin_vm_tmp_artifacts

    - name: Remove transient Gondolin VM artifacts
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ gondolin_vm_tmp_artifacts.files }}"
