---
- name: Ensure OpenClaw data directory exists inside Gondolin guest
  ansible.builtin.file:
    path: /spool/openclaw
    state: directory
    mode: "0755"

- name: Ensure OpenClaw npm global prefix directory exists inside Gondolin guest
  ansible.builtin.file:
    path: /spool/openclaw/npm-global
    state: directory
    mode: "0755"

- name: Ensure OpenClaw npm cache directory exists inside Gondolin guest
  ansible.builtin.file:
    path: /spool/openclaw/npm-cache
    state: directory
    mode: "0755"

- name: Ensure OpenClaw home directory exists inside Gondolin guest
  ansible.builtin.file:
    path: /spool/openclaw/home
    state: directory
    mode: "0755"

- name: Require working Node.js and npm with node:sqlite inside Gondolin guest
  ansible.builtin.shell: |
    set -euo pipefail
    node --version >/dev/null
    npm --version >/dev/null
    node -e "require('node:sqlite')"
  args:
    executable: /bin/bash
  changed_when: false

- name: Self-update npm inside Gondolin guest
  ansible.builtin.shell: curl -qL https://npmjs.org/install.sh | sh
  args:
    executable: /bin/bash
  environment:
    npm_config_cache: /spool/openclaw/npm-cache
    HOME: /spool/openclaw/home

- name: Ensure git is present inside Gondolin guest
  ansible.builtin.package:
    name: git
    state: present

- name: Install OpenClaw CLI into spool-backed npm prefix inside Gondolin guest
  ansible.builtin.command:
    argv:
      - npm
      - install
      - -g
      - --prefix
      - /spool/openclaw/npm-global
      - openclaw@latest
  args:
    creates: /spool/openclaw/npm-global/bin/openclaw
  environment:
    npm_config_cache: /spool/openclaw/npm-cache
    HOME: /spool/openclaw/home

- name: Verify OpenClaw CLI inside Gondolin guest
  ansible.builtin.command:
    argv:
      - /spool/openclaw/npm-global/bin/openclaw
      - --version
  changed_when: false

- name: Start temporary OpenClaw gateway session for in-guest probe
  ansible.builtin.command:
    argv:
      - timeout
      - "300"
      - /spool/openclaw/npm-global/bin/openclaw
      - gateway
      - --allow-unconfigured
      - --dev
      - --port
      - "{{ claw_gateway_port | int | string }}"
      - --verbose
  environment:
    OPENCLAW_HOME: /spool/openclaw/home
  register: openclaw_gateway_session
  async: 360
  poll: 0

- name: Wait for OpenClaw gateway port inside guest
  ansible.builtin.wait_for:
    host: "{{ claw_gateway_host }}"
    port: "{{ claw_gateway_port | int }}"
    timeout: 120

- name: Probe OpenClaw gateway inside guest
  ansible.builtin.uri:
    url: "http://{{ claw_gateway_host }}:{{ claw_gateway_port | int }}/"
    status_code: 200
  register: openclaw_gateway_probe
  retries: 90
  delay: 2
  until: openclaw_gateway_probe.status == 200

- name: Stop temporary OpenClaw gateway session
  ansible.builtin.command:
    argv:
      - pkill
      - -f
      - "/spool/openclaw/npm-global/bin/openclaw gateway --allow-unconfigured --dev --port {{ claw_gateway_port | int }}"
  register: openclaw_gateway_stop
  changed_when: openclaw_gateway_stop.rc == 0
  failed_when: openclaw_gateway_stop.rc not in [0, 1]

- name: Wait for temporary gateway session to exit
  ansible.builtin.async_status:
    jid: "{{ openclaw_gateway_session.ansible_job_id }}"
  register: openclaw_gateway_session_status
  retries: 180
  delay: 2
  until: openclaw_gateway_session_status.finished
