- name: Provision sandbox layer
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    sandbox_gateway_host: "{{ gondolin_sandbox_host | default('127.0.0.1') }}"
    sandbox_gateway_port: "{{ gondolin_sandbox_port | default(38070) }}"
    gondolin_repo: "{{ gondolin_repo_url | default('https://github.com/earendil-works/gondolin.git') }}"
  roles:
    - sandbox

- name: Provision OpenClaw layer
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars:
    claw_gateway_host: "{{ openclaw_gateway_host | default('127.0.0.1') }}"
    claw_gateway_port: "{{ openclaw_gateway_port | default(38080) }}"
  roles:
    - openclaw

- name: Provision telemetry layer
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  roles:
    - telemetry
