- name: Provision OpenCreel host
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  roles:
    - collectors

- name: Provision Gondolin/OpenClaw runtime
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    claw_gateway_host: "{{ openclaw_gateway_host | default('127.0.0.1') }}"
    claw_gateway_port: "{{ openclaw_gateway_port | default(38080) }}"
  roles:
    - claw
